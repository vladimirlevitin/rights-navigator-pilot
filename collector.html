<!doctype html><meta charset="utf-8"><title>Tatiana collector</title><style>body{font:16px system-ui;margin:24px;max-width:900px}</style><h1>Сбор кейсов</h1><p id="status">Ожидаю данные от Facebook…</p><script>
const T=/Татьяна\s+Берлин|Tatiana\s+Berlin/i,n=s=>(s||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim(),meta=/^(Нравится|Ответить|Поделиться|Like|Reply|Share|Автор|Администратор|Комментировать как.*|Ответить как.*|Смотреть другие.*|Посмотреть .*ответ.*)$/i;
function clean(s){return n(n(s).split('\n').map(n).filter(Boolean).filter(x=>!meta.test(x)&&!/^·$/.test(x)&&!/^\d+\s*(мин|ч|час|дн|день|дня|дней)\.?$/i.test(x)).join('\n'))}
function dedupe(s){s=clean(s);let l=s.split('\n').map(n).filter(Boolean);if(l.length%2===0){const h=l.length/2,a=n(l.slice(0,h).join('\n')),b=n(l.slice(h).join('\n'));if(a===b)return a}return n(l.filter((x,i)=>i===0||x!==l[i-1]).join('\n'))}
function root(i,a){let r=i,p=a[i]?.parent,g=0;while(Number.isInteger(p)&&p>=0&&a[p]&&g++<20){r=p;p=a[p].parent}return r}
function qscore(s){let x=0;if(s.length>40)x+=2;if(/[?？]/.test(s))x+=4;if(/подскаж|вопрос|положен|положено|имею право|можно ли|что делать|как поступить|как получить|закон|пособ|работодатель|пенси|инвалид/i.test(s))x+=3;if(T.test(s))x-=20;return x}
function parse(p){const a=(p.articles||[]).map((x,i)=>({i,parent:Number.isInteger(x.parent)?x.parent:-1,text:dedupe(x.text||''),own:dedupe(x.own||''),more:!!x.more}));const out=[],skipped=[],seen=new Set();for(let i=0;i<a.length;i++){const ans=a[i],at=ans.own||ans.text;if(!T.test(at))continue;let answer=at.replace(/^Татьяна\s+Берлин\s*/i,'').replace(/^Tatiana\s+Berlin\s*/i,'').trim();if(answer.length<30)continue;const r=root(i,a),ra=a[r];let question=r!==i?(ra.own||''):'';if(qscore(question)<3){let best=null;for(let j=0;j<a.length;j++){if(j===i||root(j,a)!==r)continue;const s=a[j].own||'';const sc=qscore(s);if(sc>=3&&(!best||sc>best.sc))best={s,sc,more:a[j].more}}if(best)question=best.s}
question=dedupe(question);if(qscore(question)<3){skipped.push({answer_preview:answer.slice(0,140),reason:'Не найден уверенный вопрос внутри родительского поста.'});continue}const key=question.slice(0,250)+'|'+answer.slice(0,250);if(seen.has(key))continue;seen.add(key);let status='ok',reasons=[];if(ra?.more){status='incomplete';reasons.push('Вопрос содержит «Ещё».')}if(ans.more){status='incomplete';reasons.push('Ответ Татьяны содержит «Ещё».')}out.push({question,tatiana_answer:answer,source_url:p.url||'',status,reason:reasons.join(' ')})}
return {captured_at:new Date().toISOString(),page_url:p.url||'',cases:out,skipped,summary:{total:out.length,ok:out.filter(x=>x.status==='ok').length,incomplete:out.filter(x=>x.status==='incomplete').length,skipped:skipped.length}}}
function save(o){const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tatiana_cases_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
addEventListener('message',e=>{if(!e.data||e.data.kind!=='tatiana-snapshot')return;const o=parse(e.data);document.getElementById('status').textContent=`Готово. Найдено: ${o.summary.total}, готовых: ${o.summary.ok}, неполных: ${o.summary.incomplete}, пропущено: ${o.summary.skipped}. Файл скачан.`;save(o)});
</script>
