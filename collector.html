<!doctype html><meta charset="utf-8"><title>Tatiana collector</title><style>body{font:16px system-ui;margin:24px;max-width:900px}pre{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px}</style><h1>Сбор кейсов</h1><p id="status">Ожидаю данные от Facebook…</p><script>
const T=/Татьяна\s+Берлин|Tatiana\s+Berlin/i;
const M=/^(ещ[её]|see more)$/i;
const n=s=>(s||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
const meta=/^(Нравится|Ответить|Поделиться|Like|Reply|Share|Автор|Администратор|Комментировать как.*|Ответить как.*|Смотреть другие.*)$/i;
function clean(s){let a=n(s).split('\n').map(n).filter(Boolean).filter(x=>!meta.test(x)&&!/^·$/.test(x)&&!/^\d+\s*(мин|ч|час|дн|день|дня|дней)\.?$/i.test(x));return n(a.join('\n'))}
function dedupe(s){s=clean(s);const l=s.split('\n').map(n).filter(Boolean);if(l.length%2===0){const h=l.length/2,a=n(l.slice(0,h).join('\n')),b=n(l.slice(h).join('\n'));if(a===b)return a}return n(l.filter((x,i)=>i===0||x!==l[i-1]).join('\n'))}
function score(s){let x=0;if(s.length>50)x+=2;if(s.length>120)x+=2;if(/[?？]/.test(s))x+=4;if(/подскаж|вопрос|положен|положено|имею право|можно ли|что делать|как поступить|как получить|закон|выплат/i.test(s))x+=3;if(T.test(s))x-=10;return x}
function parse(payload){const arts=(payload.articles||[]).map((x,i)=>({i,text:dedupe(x.text||''),more:!!x.more})).filter(x=>x.text.length>20);const out=[],skipped=[],seen=new Set();for(let i=0;i<arts.length;i++){const a=arts[i];if(!T.test(a.text))continue;let answer=a.text.replace(/^Татьяна\s+Берлин\s*/i,'').replace(/^Tatiana\s+Berlin\s*/i,'').trim();if(answer.length<30)continue;let best=null;for(let j=i-1;j>=0&&j>=i-4;j--){const q=arts[j];if(T.test(q.text))continue;const sc=score(q.text);if(sc<3)continue;if(!best||sc>best.sc)best={q,sc}}if(!best){skipped.push({answer_preview:answer.slice(0,140),reason:'Не найден уверенный вопрос в соседних блоках этого фрагмента.'});continue}const key=best.q.text.slice(0,250)+'|'+answer.slice(0,250);if(seen.has(key))continue;seen.add(key);const reasons=[];let status='ok';if(best.q.more){status='incomplete';reasons.push('Вопрос содержит «Ещё».')}if(a.more){status='incomplete';reasons.push('Ответ Татьяны содержит «Ещё».')}out.push({question:best.q.text,tatiana_answer:answer,source_url:payload.url||'',status,reason:reasons.join(' ')})}
return {captured_at:new Date().toISOString(),page_url:payload.url||'',cases:out,skipped,summary:{total:out.length,ok:out.filter(x=>x.status==='ok').length,incomplete:out.filter(x=>x.status==='incomplete').length,skipped:skipped.length}}}
function save(o){const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tatiana_cases_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
addEventListener('message',e=>{if(!e.data||e.data.kind!=='tatiana-snapshot')return;const o=parse(e.data);document.getElementById('status').textContent=`Готово. Найдено: ${o.summary.total}, готовых: ${o.summary.ok}, неполных: ${o.summary.incomplete}, пропущено: ${o.summary.skipped}. Файл скачан.`;save(o)});
</script>
