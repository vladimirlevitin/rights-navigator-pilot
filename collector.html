<!doctype html><meta charset="utf-8"><title>Tatiana collector</title><style>body{font:16px system-ui;margin:24px;max-width:900px}</style><h1>Сбор кейсов</h1><p id="status">Ожидаю данные от Facebook…</p><script>
const T=/Татьяна\s+Берлин|Tatiana\s+Berlin/i,n=s=>(s||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim(),meta=/^(Нравится|Ответить|Поделиться|Like|Reply|Share|Автор|Администратор|Комментировать как.*|Ответить как.*|Смотреть другие.*|Посмотреть .*ответ.*)$/i;
function clean(s){let a=n(s).split('\n').map(n).filter(Boolean).filter(x=>!meta.test(x)&&!/^·$/.test(x)&&!/^\d+\s*(мин|ч|час|дн|день|дня|дней)\.?$/i.test(x));return n(a.join('\n'))}
function dedupe(s){s=clean(s);let l=s.split('\n').map(n).filter(Boolean);if(l.length%2===0){const h=l.length/2,a=n(l.slice(0,h).join('\n')),b=n(l.slice(h).join('\n'));if(a===b)return a}for(let k=2;k<=Math.floor(l.length/2);k++){const a=n(l.slice(0,k).join('\n')),b=n(l.slice(k,2*k).join('\n'));if(a===b){l=l.slice(k);break}}return n(l.filter((x,i)=>i===0||x!==l[i-1]).join('\n'))}
function score(s){let x=0;if(s.length>50)x+=2;if(s.length>120)x+=2;if(/[?？]/.test(s))x+=4;if(/подскаж|вопрос|положен|положено|имею право|можно ли|что делать|как поступить|как получить|закон|выплат|пособ/i.test(s))x+=3;if(T.test(s))x-=12;return x}
function root(i,a){let r=i,p=a[i]?.parent,guard=0;while(Number.isInteger(p)&&p>=0&&a[p]&&guard++<20){r=p;p=a[p].parent}return r}
function parse(payload){const src=payload.articles||[];const a=src.map((x,i)=>({i,parent:Number.isInteger(x.parent)?x.parent:-1,text:dedupe(x.text||''),more:!!x.more,valid:dedupe(x.text||'').length>20}));const out=[],skipped=[],seen=new Set();for(let i=0;i<a.length;i++){const ans=a[i];if(!ans.valid||!T.test(ans.text))continue;let answer=ans.text.replace(/^Татьяна\s+Берлин\s*/i,'').replace(/^Tatiana\s+Berlin\s*/i,'').trim();if(answer.length<30)continue;const rr=root(i,a);let best=null;for(let j=i-1;j>=0;j--){const q=a[j];if(!q.valid||root(j,a)!==rr||T.test(q.text))continue;const sc=score(q.text);if(sc<3)continue;const distance=i-j;const rank=sc*100-distance;if(!best||rank>best.rank)best={q,rank}}if(!best){skipped.push({answer_preview:answer.slice(0,140),reason:'В том же посте не найден уверенный вопрос.'});continue}const key=best.q.text.slice(0,250)+'|'+answer.slice(0,250);if(seen.has(key))continue;seen.add(key);let status='ok';const rs=[];if(best.q.more){status='incomplete';rs.push('Вопрос содержит «Ещё».')}if(ans.more){status='incomplete';rs.push('Ответ Татьяны содержит «Ещё».')}out.push({question:best.q.text,tatiana_answer:answer,source_url:payload.url||'',status,reason:rs.join(' ')})}return {captured_at:new Date().toISOString(),page_url:payload.url||'',cases:out,skipped,summary:{total:out.length,ok:out.filter(x=>x.status==='ok').length,incomplete:out.filter(x=>x.status==='incomplete').length,skipped:skipped.length}}}
function save(o){const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tatiana_cases_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
addEventListener('message',e=>{if(!e.data||e.data.kind!=='tatiana-snapshot')return;const o=parse(e.data);document.getElementById('status').textContent=`Готово. Найдено: ${o.summary.total}, готовых: ${o.summary.ok}, неполных: ${o.summary.incomplete}, пропущено: ${o.summary.skipped}. Файл скачан.`;save(o)});
</script>
