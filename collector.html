<!doctype html><meta charset="utf-8"><title>Tatiana collector</title><style>body{font:16px system-ui;margin:24px;max-width:900px}</style><h1>Сбор кейсов</h1><p id="status">Ожидаю данные от Facebook…</p><script>
const VERSION='dom-v10';
const T=/Татьяна\s+Берлин|Tatiana\s+Berlin/i;
const n=s=>(s||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
function cleanTail(s){s=n(s||'');s=s.replace(/(?:Нравится|Like)\s*(?:Ответить|Reply)\s*(?:Поделиться|Share).*$/is,'');s=s.replace(/(?:Смотреть другие ответы|Посмотреть\s+\d+\s+ответ(?:а|ов)?|Ответить как\s+[^\n]+).*$/is,'');s=s.replace(/Комментировать как.*$/is,'');s=s.replace(/(?:\d+\s*){1,5}$/,'');return n(s)}
function dedupe(s){s=n(s);let l=s.split('\n').map(n).filter(Boolean);if(l.length%2===0){const h=l.length/2,a=n(l.slice(0,h).join('\n')),b=n(l.slice(h).join('\n'));if(a===b)return a}return n(l.filter((x,i)=>i===0||x!==l[i-1]).join('\n'))}
function questionText(s){s=dedupe(s);const marker='Поделился/-ась с Общедоступная группа';let k=s.indexOf(marker);if(k>=0)s=s.slice(k+marker.length);else{s=s.replace(/^.{0,120}?(?:\d+\s*(?:мин|ч|дн|день|дня|дней)\.?\s*·?\s*)/i,'')}return cleanTail(s)}
function answerText(s){s=dedupe(s);let k=s.lastIndexOf('Администратор');if(k>=0)s=s.slice(k+'Администратор'.length);else{s=s.replace(/^Татьяна\s+Берлин/i,'').replace(/^Tatiana\s+Berlin/i,'')}return cleanTail(s)}
function rootOf(i,a){let r=i,p=a[i]?.parent,g=0;while(Number.isInteger(p)&&p>=0&&a[p]&&g++<20){r=p;p=a[p].parent}return r}
function parse(p){const a=(p.articles||[]).map((x,i)=>({i,parent:Number.isInteger(x.parent)?x.parent:-1,text:dedupe(x.text||''),own:dedupe(x.own||''),more:!!x.more}));const out=[],skipped=[],seen=new Set();for(const post of a.filter(x=>x.parent<0)){const postOwn=post.own||'';if(!postOwn||T.test(postOwn))continue;const question=questionText(postOwn);if(question.length<25)continue;const answers=a.filter(x=>x.i!==post.i&&rootOf(x.i,a)===post.i&&T.test(x.own||x.text||''));for(const ans of answers){const answer=answerText(ans.own||ans.text||'');if(answer.length<25)continue;const key=question.slice(0,250)+'|'+answer.slice(0,250);if(seen.has(key))continue;seen.add(key);let status='ok',rs=[];if(post.more){status='incomplete';rs.push('Вопрос содержит «Ещё».')}if(ans.more){status='incomplete';rs.push('Ответ Татьяны содержит «Ещё».')}out.push({question,tatiana_answer:answer,source_url:p.url||'',status,reason:rs.join(' '),_debug:{post_index:post.i,answer_index:ans.i}})}}const tatianaTop=a.filter(x=>x.parent<0&&T.test(x.own||''));for(const x of tatianaTop)skipped.push({answer_preview:(x.own||x.text||'').slice(0,140),reason:'Это отдельный пост Татьяны, а не ответ на вопрос — пропущен.'});return {collector_version:VERSION,captured_at:new Date().toISOString(),page_url:p.url||'',cases:out,skipped,summary:{articles:a.length,total:out.length,ok:out.filter(x=>x.status==='ok').length,incomplete:out.filter(x=>x.status==='incomplete').length,skipped:skipped.length}}}
function save(o){const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tatiana_cases_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
addEventListener('message',e=>{if(!e.data||e.data.kind!=='tatiana-snapshot')return;const o=parse(e.data);document.getElementById('status').textContent=`Версия ${VERSION}. Найдено: ${o.summary.total}, готовых: ${o.summary.ok}, неполных: ${o.summary.incomplete}, пропущено: ${o.summary.skipped}. Файл скачан.`;save(o)});
</script>
