<!doctype html><meta charset="utf-8"><title>Tatiana collector</title><style>body{font:16px system-ui;margin:24px;max-width:900px}</style><h1>Сбор кейсов</h1><p id="status">Ожидаю данные от Facebook…</p><script>
const T=/Татьяна\s+Берлин|Tatiana\s+Berlin/i,n=s=>(s||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim(),meta=/^(Нравится|Ответить|Поделиться|Like|Reply|Share|Автор|Администратор|Комментировать как.*|Ответить как.*|Смотреть другие.*|Посмотреть .*ответ.*)$/i;
function clean(s){return n(n(s).split('\n').map(n).filter(Boolean).filter(x=>!meta.test(x)&&!/^·$/.test(x)&&!/^\d+\s*(мин|ч|час|дн|день|дня|дней)\.?$/i.test(x)&&!/^[0-9]+$/.test(x)).join('\n'))}
function dedupe(s){s=clean(s);let l=s.split('\n').map(n).filter(Boolean);if(l.length%2===0){const h=l.length/2,a=n(l.slice(0,h).join('\n')),b=n(l.slice(h).join('\n'));if(a===b)return a}return n(l.filter((x,i)=>i===0||x!==l[i-1]).join('\n'))}
function qscore(s){let x=0;if(s.length>40)x+=2;if(/[?？]/.test(s))x+=5;if(/подскаж|вопрос|положен|положено|имею право|можно ли|что делать|как поступить|как получить|закон|пособ|работодатель|пенси|инвалид|отпуск/i.test(s))x+=3;if(T.test(s))x-=20;return x}
function answerText(x){let s=dedupe(x.own||x.text||'');const k=s.search(T);if(k<0)return'';s=s.slice(k).replace(/^Татьяна\s+Берлин\s*/i,'').replace(/^Tatiana\s+Berlin\s*/i,'').trim();return s}
function parse(p){const a=(p.articles||[]).map((x,i)=>({i,text:dedupe(x.text||''),own:dedupe(x.own||''),more:!!x.more,top:+x.top||i*100,left:+x.left||0,width:+x.width||0,height:+x.height||0,depth:+x.depth||0,parent:Number.isInteger(x.parent)?x.parent:-1}));const out=[],skipped=[],seen=new Set();for(const ans of a){const answer=answerText(ans);if(answer.length<30)continue;const cand=[];for(const q of a){if(q.i===ans.i)continue;const qs=dedupe(q.own||'');const sc=qscore(qs);if(sc<3)continue;if(q.top>ans.top+10)continue;const dy=Math.max(0,ans.top-(q.top+q.height));const dx=Math.abs((q.left+q.width/2)-(ans.left+ans.width/2));const sameParent=(q.parent===ans.parent&&q.parent>=0)?1:0;const contains=(q.top<=ans.top&&q.top+q.height>=ans.top)?1:0;const rank=sc*1000 + sameParent*500 + contains*350 - Math.min(dy,2000) - Math.min(dx,1000)*0.2 - Math.abs(q.depth-ans.depth)*20;cand.push({q,qs,rank})}cand.sort((x,y)=>y.rank-x.rank);const best=cand[0];if(!best){skipped.push({answer_preview:answer.slice(0,140),reason:'Не найден уверенный вопрос рядом с ответом Татьяны.'});continue}const question=best.qs,key=question.slice(0,250)+'|'+answer.slice(0,250);if(seen.has(key))continue;seen.add(key);let status='ok',rs=[];if(best.q.more){status='incomplete';rs.push('Вопрос содержит «Ещё».')}if(ans.more){status='incomplete';rs.push('Ответ Татьяны содержит «Ещё».')}out.push({question,tatiana_answer:answer,source_url:p.url||'',status,reason:rs.join(' '),_debug:{q_index:best.q.i,a_index:ans.i,rank:Math.round(best.rank)}})}return {captured_at:new Date().toISOString(),page_url:p.url||'',cases:out,skipped,summary:{total:out.length,ok:out.filter(x=>x.status==='ok').length,incomplete:out.filter(x=>x.status==='incomplete').length,skipped:skipped.length}}}
function save(o){const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tatiana_cases_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
addEventListener('message',e=>{if(!e.data||e.data.kind!=='tatiana-snapshot')return;const o=parse(e.data);document.getElementById('status').textContent=`Готово. Найдено: ${o.summary.total}, готовых: ${o.summary.ok}, неполных: ${o.summary.incomplete}, пропущено: ${o.summary.skipped}. Файл скачан.`;save(o)});
</script>
