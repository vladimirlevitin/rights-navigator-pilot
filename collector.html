<!doctype html><meta charset="utf-8"><title>Tatiana collector</title><style>body{font:16px system-ui;margin:24px;max-width:900px}</style><h1>Сбор кейсов</h1><p id="status">Ожидаю данные от Facebook…</p><script>
const VERSION='dom-v7';
const T=/Татьяна\s+Берлин|Tatiana\s+Berlin/i,n=s=>(s||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim(),meta=/^(Нравится|Ответить|Поделиться|Like|Reply|Share|Автор|Администратор|Комментировать как.*|Ответить как.*|Смотреть другие.*|Посмотреть .*ответ.*)$/i;
function clean(s){return n(n(s).split('\n').map(n).filter(Boolean).filter(x=>!meta.test(x)&&!/^·$/.test(x)&&!/^\d+\s*(мин|ч|час|дн|день|дня|дней)\.?$/i.test(x)&&!/^[0-9]+$/.test(x)).join('\n'))}
function dedupe(s){s=clean(s);let l=s.split('\n').map(n).filter(Boolean);if(l.length%2===0){const h=l.length/2,a=n(l.slice(0,h).join('\n')),b=n(l.slice(h).join('\n'));if(a===b)return a}return n(l.filter((x,i)=>i===0||x!==l[i-1]).join('\n'))}
function stripHeader(s,isTatiana=false){let l=dedupe(s).split('\n').map(n).filter(Boolean);if(!l.length)return'';if(isTatiana&&T.test(l[0]))l.shift();else if(!isTatiana&&l[0].length<100&&!/[?？]/.test(l[0]))l.shift();while(l.length&&(/^(Подтвержденный аккаунт|Администратор|Общедоступная группа)$/i.test(l[0])||/^·/.test(l[0])||/^(\d+\s*(мин|ч|час|дн|день|дня|дней)\.?)(\s*·.*)?$/i.test(l[0])||/Поделился\/-ась с Общедоступная группа/i.test(l[0])))l.shift();return n(l.join('\n'))}
function rootOf(i,a){let r=i,p=a[i]?.parent,g=0;while(Number.isInteger(p)&&p>=0&&a[p]&&g++<20){r=p;p=a[p].parent}return r}
function parse(p){const a=(p.articles||[]).map((x,i)=>({i,parent:Number.isInteger(x.parent)?x.parent:-1,text:dedupe(x.text||''),own:dedupe(x.own||''),more:!!x.more}));const out=[],skipped=[],seen=new Set();for(const post of a.filter(x=>x.parent<0)){
  const postOwn=post.own||'';
  if(!postOwn||T.test(postOwn))continue;
  const question=stripHeader(postOwn,false);
  if(question.length<25)continue;
  const answers=a.filter(x=>x.i!==post.i&&rootOf(x.i,a)===post.i&&T.test(x.text||''));
  for(const ans of answers){let raw=ans.own||ans.text||'';let answer=stripHeader(raw,true);if(answer.length<25)continue;const key=question.slice(0,250)+'|'+answer.slice(0,250);if(seen.has(key))continue;seen.add(key);let status='ok',rs=[];if(post.more){status='incomplete';rs.push('Вопрос содержит «Ещё».')}if(ans.more){status='incomplete';rs.push('Ответ Татьяны содержит «Ещё».')}out.push({question,tatiana_answer:answer,source_url:p.url||'',status,reason:rs.join(' '),_debug:{post_index:post.i,answer_index:ans.i}})}
 }
 const tatianaTop=a.filter(x=>x.parent<0&&T.test(x.own||''));for(const x of tatianaTop)skipped.push({answer_preview:(x.own||x.text||'').slice(0,140),reason:'Это отдельный пост Татьяны, а не ответ на вопрос — пропущен.'});
 return {collector_version:VERSION,captured_at:new Date().toISOString(),page_url:p.url||'',cases:out,skipped,summary:{total:out.length,ok:out.filter(x=>x.status==='ok').length,incomplete:out.filter(x=>x.status==='incomplete').length,skipped:skipped.length}}}
function save(o){const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tatiana_cases_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
addEventListener('message',e=>{if(!e.data||e.data.kind!=='tatiana-snapshot')return;const o=parse(e.data);document.getElementById('status').textContent=`Версия ${VERSION}. Найдено: ${o.summary.total}, готовых: ${o.summary.ok}, неполных: ${o.summary.incomplete}, пропущено: ${o.summary.skipped}. Файл скачан.`;save(o)});
</script>
